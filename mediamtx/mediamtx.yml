# Minimal static MediaMTX config.
# Cameras/paths are NOT declared here — the api service registers/removes them
# at runtime via the MediaMTX control API (POST/DELETE /v3/config/paths/*),
# so adding camera #1001 never touches this file or restarts the process.

logLevel: info

# MediaMTX >= 1.12 restricts the control API ("api" action) to
# localhost by default. The api service registers camera paths from
# its own container IP, so the api action must be allowed for the
# docker network. This POC runs without auth/RBAC by design
# (see README "Known POC shortcuts").
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:
      - action: api
      - action: metrics
      - action: pprof

api: yes
apiAddress: :9997

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

rtmp: no

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ['*']
hlsVariant: lowLatency

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ['*']

# Paths are added/removed dynamically. The one static entry is the
# synthetic demo camera: the `testsource` service publishes its test
# pattern here, and the api registers cam/<id> paths that pull from it.
paths:
  demo/cam-1:
    source: publisher
